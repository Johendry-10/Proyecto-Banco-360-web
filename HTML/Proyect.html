<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode"> <div class="main-login-container">
        <div class="login-card">
            <div class="login-card-header">
                <div class="lock-icon-container">
                    <span class="lock-placeholder">🔒</span>
                </div>
            </div>

            <div class="login-card-form">
                <h1 class="login-title">Inicia sesión ahora</h1>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Usuario <span class="required">*</span></label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                        <div class="spinner"></div>
                        <p>Validando credenciales...</p>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="btnLogin" class="btn-acceso">ACCESO</button>
                    </div>
                </form>

                <div class="login-footer-links">
                    <a href="pages/register.html" class="register-link">¿No tienes una cuenta?</a>
                    <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
            <p class="freepik-credit">Banca 360 - UCAB 2025</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>

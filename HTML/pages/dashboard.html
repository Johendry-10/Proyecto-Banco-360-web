<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <script>
        if (localStorage.getItem('banca360_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo-container">
                <h2>Banca 360</h2>
            </div>
            
            <div class="profile-nav-container">
                <button id="nav-perfil-icon" class="profile-btn" title="Ir a mi perfil">
                    <span class="material-symbols-outlined" style="font-size: 60px;">account_circle</span>
                    <p>Mi Perfil</p>
                </button>
            </div>

    <nav class="sidebar-nav" style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
        <button id="nav-resumen" class="nav-btn active">
             <span class="material-symbols-outlined">home</span> Resumen
         </button>
         <button id="nav-historial" class="nav-btn">
             <span class="material-symbols-outlined">history</span> Historial
         </button>
         <button id="nav-transferencias" class="nav-btn">
                <span class="material-symbols-outlined">swap_horiz</span> Transferencias
         </button>
         <button id="nav-pagomovil" class="nav-btn">
               <span class="material-symbols-outlined">phone_android</span> Pago Móvil
         </button>
         <button id="nav-deposito" class="nav-btn">
             <span class="material-symbols-outlined">payments</span> Depósito
         </button>
    </nav>
        </aside>

        <main class="main-content">
            <section id="view-resumen" class="view-section active">
                <h1>Resumen de Cuenta</h1>
                
                <div class="balance-card">
                    <p>Saldo Actual</p>
                    <div class="balance-display">
                        <h2 id="balance-amount">$0.00</h2>
                        <span class="material-symbols-outlined toggle-eye" id="toggle-balance">visibility</span>
                    </div>
                </div>




                <div class="recent-transactions-container">
                    <h3>Últimos Movimientos</h3>
                    <div class="transaction-list" id="recent-transactions-list">
                    </div>
                </div>
            </section>
        <section id="view-transferencias" class="view-section" style="display: none;">
                <h1>Transferencias</h1>
                
                <div class="balance-card" style="padding: 30px; max-width: 600px; margin-top: 20px;">
                    <form id="form-transferencias">
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Cuenta destino <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="text" id="tx-dest" class="modal-input" placeholder="Ej: 04141234567 o correo" required>
                        </div>
                        
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Monto a transferir <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="number" id="tx-amount" class="modal-input" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                        
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Concepto de la transferencia <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="text" id="tx-concept" class="modal-input" placeholder="Motivo de pago" required>
                        </div>
                        
                        <span id="tx-error" style="display: none; color: var(--error-color); font-size: 0.85rem; margin-bottom: 15px; display: block;"></span>
                        
                        <div class="modal-actions" style="justify-content: flex-start; margin-top: 30px;">
                            <button type="submit" class="btn-modal-confirm" style="width: auto; padding: 10px 30px;">Procesar</button>
                            <button type="button" class="btn-modal-cancel btn-volver-resumen" style="width: auto; padding: 10px 30px;">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="view-pagomovil" class="view-section" style="display: none;">
                <h1>Pago Móvil</h1>
                
                <div class="balance-card" style="padding: 30px; max-width: 600px; margin-top: 20px;">
                    <form id="form-pagomovil">
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Teléfono destino <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="tel" id="pm-phone" class="modal-input" placeholder="Ej: 04141234567" required>
                        </div>
                        
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Cédula destino <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="text" id="pm-cedula" class="modal-input" placeholder="Ej: V-12345678" required>
                        </div>
                        
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Monto a transferir <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="number" id="pm-amount" class="modal-input" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                        
                        <span id="pm-error" style="display: none; color: var(--error-color); font-size: 0.85rem; margin-bottom: 15px; display: block;"></span>
                        
                        <div class="modal-actions" style="justify-content: flex-start; margin-top: 30px;">
                            <button type="submit" class="btn-modal-confirm" style="width: auto; padding: 10px 30px;">Procesar</button>
                            <button type="button" class="btn-modal-cancel btn-volver-resumen" style="width: auto; padding: 10px 30px;">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="view-deposito" class="view-section" style="display: none;">
                <h1>Depósito</h1>
                
                <div class="balance-card" style="padding: 30px; max-width: 600px; margin-top: 20px;">
                    <form id="form-deposito">
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Monto a depositar <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="number" id="dp-amount" class="modal-input" placeholder="0.00" min="1" step="0.01" required>
                        </div>
                        
                        <div class="form-group-modal" style="margin-bottom: 20px;">
                            <label>Referencia / Origen de los fondos <span class="required" style="color: var(--error-color);">*</span></label>
                            <input type="text" id="dp-reference" class="modal-input" placeholder="Ej: Taquilla, Cajero automático..." required>
                        </div>
                        
                        <div class="modal-actions" style="justify-content: flex-start; margin-top: 30px;">
                            <button type="submit" class="btn-modal-confirm" style="width: auto; padding: 10px 30px;">Procesar</button>
                            <button type="button" class="btn-modal-cancel btn-volver-resumen" style="width: auto; padding: 10px 30px;">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="view-historial" class="view-section">
                <h1>Historial de Movimientos</h1>
                
                <div class="filters-container">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="in">Solo Entradas</button>
                    <button class="filter-btn" data-filter="out">Solo Salidas</button>
                </div>

                <div class="transaction-list full-history" id="all-transactions-list">
                </div>

            </section>
        </main>
    </div>

    <div id="transaction-modal" class="modal" >
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2>Detalle de Transacción</h2>
            <div id="modal-details" class="modal-details-grid">
            </div>
        </div>
    </div>

    <script src="../js/transacciones.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo-container">
                <h2>Banca 360</h2>
            </div>
            
            <div class="profile-nav-container">
                <button id="nav-perfil-icon" class="profile-btn" title="Ir a mi perfil">
                    <span class="material-symbols-outlined" style="font-size: 60px;">account_circle</span>
                    <p>Mi Perfil</p>
                </button>
            </div>

            <nav class="main-nav">
                <button class="nav-btn" id="nav-resumen">
                    <span class="material-symbols-outlined">home</span> Menú Principal
                </button>
                
                <button class="nav-btn active" id="nav-historial">
                    <span class="material-symbols-outlined">history</span> Historial
                </button>
                
                <button class="nav-btn" id="nav-pagomovil">
                    <span class="material-symbols-outlined">send_to_mobile</span> Pago Móvil
                </button>
                
                <button class="nav-btn" id="nav-transferencia">
                    <span class="material-symbols-outlined">sync_alt</span> Transferir
                </button>
                
                <button class="nav-btn" id="nav-deposito">
                    <span class="material-symbols-outlined">account_balance</span> Depósito
                </button>
                
                <button class="nav-btn" id="nav-logout" style="margin-top: auto;">
                    <span class="material-symbols-outlined">logout</span> Salir
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <section id="view-historial" class="view-section" style="display: block;">
                <h1>Historial de Movimientos</h1>
                
                <div class="filters-container">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="in">Solo Entradas</button>
                    <button class="filter-btn" data-filter="out">Solo Salidas</button>
                </div>

                <div class="transaction-list full-history" id="all-transactions-list">
                    </div>
            </section>
        </main>
    </div>

    <script src="../js/transacciones.js"></script>
    <script src="../js/historial.js"></script>
</body>
</html>

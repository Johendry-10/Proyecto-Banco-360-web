<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="main-login-container">
        <div class="login-card">
            <div class="login-card-header">
                <div class="lock-icon-container">
                    <span class="lock-placeholder">🔒</span>
                </div>
            </div>
            <div class="login-card-form">
                <h1 class="login-title">Iniciar Sesión</h1>
                <form id="loginForm" class="login-form" novalidate>
                    <div id="general-error" class="error-text" style="display: none; text-align: center; margin-bottom: 15px;"></div>
                    <div class="form-group">
                        <label for="username" class="form-label">Correo electrónico <span class="required">*</span></label>
                        <input type="email" id="username" name="username" class="form-control" placeholder="Ingresa tu correo" required>
                        <span id="email-error" class="error-text" style="display: none;"></span>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
                        <div class="password-input-container">
                            <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                            <span class="material-symbols-outlined toggle-password" onclick="togglePasswordVisibility('password', this)">visibility</span>
                        </div>
                        <span id="password-error" class="error-text" style="display: none;"></span>
                    </div>
                    <div class="form-options">
                        <div class="remember-me-container">
                            <input type="checkbox" id="remember_me" name="remember_me">
                            <label for="remember_me">Recordarme</label>
                        </div>
                    </div>
                    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                    <div class="button-group">
                        <button type="submit" id="btnLogin" class="btn-acceso">ACCESO</button>
                    </div>
                </form>
                <div class="login-footer-links">
                    <a href="pages/register.html" class="register-link">¿No tienes una cuenta?</a>
                    <a href="pages/olvido-contrasena.html" class="forgot-password-link">¿Se te olvidó tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>

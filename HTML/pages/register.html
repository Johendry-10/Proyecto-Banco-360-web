<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="main-login-container">
        <div class="login-card">
            <a href="../index.html" class="back-arrow">&larr;</a>
            <div class="login-card-header">
                <div class="lock-icon-container">
                    <span class="lock-placeholder">👤</span>
                </div>
            </div>
            <div class="login-card-form">
                <h1 class="login-title">Registrarse</h1>
                <form id="registerForm" class="login-form" novalidate>
                    <div id="general-error" class="error-text" style="display: none; text-align: center; margin-bottom: 15px;"></div>

                    <div id="step-1">
                        <div class="form-group">
                            <label for="reg-username" class="form-label">Nombre Completo <span class="required">*</span></label>
                            <input type="text" id="reg-username" name="username" class="form-control" placeholder="Crea tu usuario" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="reg-email" class="form-label">Correo electrónico <span class="required">*</span></label>
                            <input type="email" id="reg-email" name="email" class="form-control" placeholder="Ingresa tu correo" required>
                            <span id="email-error" class="error-text" style="display: none;"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="reg-password" class="form-label">Contraseña <span class="required">*</span></label>
                            <div class="password-input-container">
                                <input type="password" id="reg-password" name="password" class="form-control" placeholder="Crea tu contraseña" required>
                                <span class="material-symbols-outlined toggle-password" onclick="togglePasswordVisibility('reg-password', this)">visibility</span>
                            </div>
                            <span id="password-error" class="error-text" style="display: none;"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="reg-confirm-password" class="form-label">Confirmar contraseña <span class="required">*</span></label>
                            <div class="password-input-container">
                                <input type="password" id="reg-confirm-password" name="confirm_password" class="form-control" placeholder="Repite tu contraseña" required>
                                <span class="material-symbols-outlined toggle-password" onclick="togglePasswordVisibility('reg-confirm-password', this)">visibility</span>
                            </div>
                            <span id="confirm-password-error" class="error-text" style="display: none;"></span>
                        </div>
                        
                        <div class="button-group">
                            <button type="button" id="btnNext" class="btn-acceso">Siguiente</button>
                        </div>
                    </div>

                    <div id="step-2" style="display: none;">
                        <div class="form-group">
                            <label for="reg-cedula" class="form-label">Cédula <span class="required">*</span></label>
                            <input type="text" id="reg-cedula" name="cedula" class="form-control" placeholder="Ej: V-12345678" required>
                            <span id="cedula-error" class="error-text" style="display: none;"></span>
                        </div>

                        <div class="form-group">
                            <label for="reg-telefono" class="form-label">Teléfono <span class="required">*</span></label>
                            <input type="tel" id="reg-telefono" name="telefono" class="form-control" placeholder="Ej: 04141234567" required>
                            <span id="telefono-error" class="error-text" style="display: none;"></span>
                        </div>

                        <div class="button-group" style="display: flex; gap: 10px; flex-direction: column;">
                            <button type="submit" id="btnRegister" class="btn-acceso">Registrarse</button>
                            <button type="button" id="btnBack" class="btn-acceso" style="background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color);">Volver</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <script src="../js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 UCAB - Iniciar Sesión</title>
    
    </head>
<body>

    <div class="main-login-container">

        <div class="login-card">

            <div class="login-card-header">
                <div class="lock-icon-container">
                    <span class="lock-placeholder">🔒</span>
                </div>
            </div>

            <div class="login-card-form">
                
                <h1 class="login-title">Inicia sesión ahora</h1>

                <form id="loginForm" action="pages/dashboard.html" method="POST" class="login-form">

                    <div class="form-group">
                        <label for="username" class="form-label">Username <span class="required">*</span></label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your Username" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your Password" required>
                    </div>

                    <div class="form-options">
                        <div class="remember-me-container">
                            <input type="checkbox" id="remember_me" name="remember_me">
                            <label for="remember_me">Remember me</label>
                        </div>
                    </div>

                    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                        <div class="spinner"></div>
                        <p>Validando credenciales...</p>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="btnLogin" class="btn-acceso">ACCESO</button>
                    </div>
                </form>

                <div class="login-footer-links">
                    <a href="pages/register.html" class="register-link">¿No tienes una cuenta?</a>
                    <a href="#" class="forgot-password-link">¿Se te olvidó tu contraseña?</a>
                </div>
            </div>

        <p class="freepik-credit">Imagen de Freepik</p>
        </div>
    </div>
</body>
</html>
